name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag follows semver and matches plugin version headers
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not valid semver (expected vMAJOR.MINOR.PATCH, e.g. v2.1.0)"
            exit 1
          fi

          PLUGIN_VERSION=$(grep -m1 '^\s*\*\s*Version:' navigation-designer.php | sed -E 's/^\s*\*\s*Version:\s*//')
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match navigation-designer.php 'Version:' header ($PLUGIN_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Stage plugin files
        run: |
          mkdir -p stage/navigation-designer
          cp navigation-designer.php uninstall.php README.md stage/navigation-designer/
          cp -r includes stage/navigation-designer/
          cp -r build stage/navigation-designer/

      - name: Build release zip
        # Linux zip always writes forward-slash paths, unlike Windows
        # Compress-Archive / System.IO.Compression.ZipFile, which produced
        # backslash-separated entries that WordPress could not extract.
        run: |
          cd stage
          zip -r "../navigation-designer-${GITHUB_REF_NAME#v}.zip" navigation-designer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: navigation-designer-*.zip
